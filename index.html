<helmet>

<style>
  :root {

  }
  html, body { margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--ink); font-family: var(--font-base); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
  a { color: var(--coral-700); text-decoration: none; }
  a:hover { color: var(--coral-600); }

</style>
</helmet>

<div style="background: var(--cream); min-height: 100vh; font-family: var(--font-base);">

        <img src="assets/naruto.png" alt="" style="position: absolute; width: 150px; height: auto; right: 250px; bottom: -60px; opacity: .12; transform: rotate(18deg);">
        <img src="assets/naruto.png" alt="" style="position: absolute; width: 96px; height: auto; left: -34px; bottom: 40px; opacity: .1; transform: rotate(8deg);">
      </div>
    </sc-if>

    <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 28px 48px 0; display: flex; align-items: center; gap: 16px;">
      
    </div>

    </div>
  </header>

  <div style="position: sticky; top: 0; z-index: 20; background: var(--cream); border-bottom: 1px solid var(--cream-200);">

        </button>
      </sc-for>
    </nav>
  </div>

  <main style="max-width: 1200px; margin: 0 auto; padding: 64px 48px 96px;">

          </div>
          <p style="margin: 0; flex: 1; font-size: var(--fs-sm); line-height: var(--lh-body); color: var(--ink-600); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">{{ card.text }}</p>

        </button>
      </sc-for>
    </div>
  </main>

  <footer style="background: var(--navy-700); color: var(--cream); text-align: center; padding: 32px 24px;">
    <p style="margin: 0; font-size: var(--fs-sm); opacity: .68;">完食提示詞菜單 · 內容持續更新中 · kanshoku.co</p>

          </div>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

class Component extends DCLogic {
  state = { stage: 0, modal: null, copied: false };

  componentDidMount() {
    this._onKey = (e) => { if (e.key === "Escape") this.setState({ modal: null }); };
    document.addEventListener("keydown", this._onKey);
  }
  componentWillUnmount() { document.removeEventListener("keydown", this._onKey); }

  pad(n) { return String(n).padStart(2, "0"); }

  flash(ok) {
    this.setState({ copied: ok ? "ok" : "fail" });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ copied: false }), 1800);
  }

  selectPromptText() {
    const el = this._textEl;
    if (!el) return false;
    try {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return true;
    } catch (e) { return false; }
  }

  legacyCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none;";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (!ok) this.selectPromptText();
      return ok;
    } catch (e) { return false; }
  }

  copy(text) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => this.flash(true),
        () => this.flash(this.legacyCopy(text))
      );
    } else {
      this.flash(this.legacyCopy(text));
    }
  }

  renderVals() {
    const idx = Math.min(this.state.stage, STAGES.length - 1);
    const stage = STAGES[idx];
    const modal = this.state.modal;

    const navItems = STAGES.map((s, i) => {
      const on = i === idx;
      return {
        num: this.pad(i + 1),
        name: s.name,
        bg: on ? "var(--coral)" : "transparent",
        fg: on ? "var(--white)" : "var(--navy)",
        border: on ? "var(--coral)" : "var(--cream-200)",
        shadow: on ? "var(--shadow-coral)" : "none",
        onClick: () => this.setState({ stage: i })
      };
    });

    const source = stage.items || Array.from({ length: stage.cards || 4 }, (_, i) => ({
      title: "[提示詞標題 " + (i + 1) + "]",
      subtitle: "[副標：一句話說明這道提示詞的用途]",
      text: PLACEHOLDER
    }));
    const cards = source.map((item) => ({
      ...item,
      onClick: () => this.setState({ modal: item, copied: false })
    }));

    return {
      navItems,
      cards,
      stageNum: this.pad(idx + 1),
      stageName: stage.name,
      stageDesc: stage.desc,
      showBlobs: this.props.showBlobs ?? true,
      gridMin: (this.props.density ?? "comfortable") === "compact" ? "220px" : "270px",
      modalOpen: !!modal,
      modalTitle: modal ? modal.title : "",
      modalSubtitle: modal ? modal.subtitle : "",
      modalText: modal ? modal.text : "",
      textRef: (el) => { this._textEl = el; },
      copyLabel: this.state.copied === "ok" ? "已複製 ✓"
        : this.state.copied === "fail" ? "已選取，請按 ⌘C／Ctrl+C"
        : "複製提示詞",
      onCopy: () => this.copy(modal ? modal.text : ""),
      onClose: () => this.setState({ modal: null }),
      onOverlayClick: (e) => { if (e.target === e.currentTarget) this.setState({ modal: null }); }
    };
  }
}
</script>
</body>
</html>
